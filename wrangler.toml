name = "crypto-intelligence-mcp"
main = "src/index.ts"
compatibility_date = "2026-11-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
APP_ENV = "production"
MCP_ROUTE = "/mcp"

# Namespace IDs must be unique within this Cloudflare account; verify before deployment.
[[ratelimits]]
name = "PREAUTH_RATE_LIMITER"
namespace_id = "781346201"
[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "781346202"
[ratelimits.simple]
limit = 300
period = 60

# Staging is a separate Worker with independent rate-limit namespaces and secrets. Verify all namespace IDs are unique in this account.
[env.staging]
name = "crypto-intelligence-mcp-staging"
workers_dev = true
vars = { APP_ENV = "staging", MCP_ROUTE = "/mcp" }

[[env.staging.ratelimits]]
name = "PREAUTH_RATE_LIMITER"
namespace_id = "781346205"
[env.staging.ratelimits.simple]
limit = 120
period = 60

[[env.staging.ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "781346206"
[env.staging.ratelimits.simple]
limit = 300
period = 60

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[env.staging.observability]
enabled = true

[env.staging.observability.logs]
enabled = true
head_sampling_rate = 1

[env.staging.observability.traces]
enabled = true
head_sampling_rate = 0.1

# Configure secrets using Wrangler secrets; never put secret values here.
